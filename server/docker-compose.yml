# Projektname fest, damit Volumes/Netz unabhaengig vom Ordnernamen heissen (stream-relay_web_data usw.).
name: stream-relay

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    container_name: mediamtx
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      # WebRTC-Medien (ICE/DTLS/SRTP) gehen direkt an MediaMTX, nicht ueber Caddy.
      - "8189:8189/udp"
    # 8889 (WHIP/WHEP) und 9997 (Control-API) bleiben intern.
    networks:
      - relay

  web:
    build:
      context: ..            # Projektverzeichnis (enthaelt web/, client/, docs/, VERSION); dieses File liegt in server/
      dockerfile: web/Dockerfile
    image: stream-relay-web:local
    container_name: web
    restart: unless-stopped
    env_file: .env
    environment:
      MEDIAMTX_API: http://mediamtx:9997
      SITE_NAME: ${SITE_NAME:-Stream Relay}
      DB_PATH: /data/app.db
      MUMBLE_ICE_URL: http://mumble:6503
      MUMBLE_HOST: ${DOMAIN}
      MUMBLE_PASSWORD: ${MUMBLE_PASSWORD}
    volumes:
      - web_data:/data
    networks:
      - relay

  # Voice-Chat (Mumble). Nutzt Caddys Let's-Encrypt-Zertifikat, damit der Client keine Zertifikatswarnung zeigt:
  # beim Start wird es aus dem caddy_data-Volume nach /data/tls kopiert, spaeter haelt mumble-ice es aktuell.
  mumble:
    image: mumblevoip/mumble-server:v1.6.870-4
    container_name: mumble
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        C=/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}
        if [ -f "$$C/${DOMAIN}.crt" ] && [ -f "$$C/${DOMAIN}.key" ]; then
          mkdir -p /data/tls
          cp -f "$$C/${DOMAIN}.crt" /data/tls/mumble.crt
          cp -f "$$C/${DOMAIN}.key" /data/tls/mumble.key
          chmod 600 /data/tls/mumble.*
          echo "[mumble] TLS-Zertifikat von Caddy uebernommen"
        else
          echo "[mumble] WARNUNG: kein Caddy-Zertifikat unter $$C, Mumble nutzt ein selbstsigniertes"
        fi
        exec /entrypoint.sh /usr/bin/mumble-server
    environment:
      MUMBLE_CONFIG_SERVERPASSWORD: ${MUMBLE_PASSWORD}
      MUMBLE_CONFIG_ICESECRETREAD: ${MUMBLE_ICE_SECRET}
      MUMBLE_CONFIG_ICESECRETWRITE: ${MUMBLE_ICE_SECRET}
      MUMBLE_CONFIG_WELCOMETEXT: "<br />Willkommen im Voice von ${SITE_NAME:-Stream Relay}.<br />"
      MUMBLE_CONFIG_REGISTERNAME: ${SITE_NAME:-Stream Relay}
      MUMBLE_CONFIG_USERS: 32
      MUMBLE_CONFIG_ALLOWPING: "false"
      MUMBLE_CONFIG_SSLCERT: /data/tls/mumble.crt
      MUMBLE_CONFIG_SSLKEY: /data/tls/mumble.key
      MUMBLE_CONFIG_BANDWIDTH: 558000
      MUMBLE_CONFIG_OPUSTHRESHOLD: 0
    ports:
      - "64738:64738/tcp"
      - "64738:64738/udp"
    volumes:
      - mumble_data:/data
      - caddy_data:/caddy:ro
    networks:
      - relay

  # Sidecar im Netz- und PID-Namespace von mumble: Praesenz per HTTP (mumble:6503, nur intern) und Zertifikatspflege.
  mumble-ice:
    build: ./mumble-ice
    image: stream-relay-mumble-ice:local
    container_name: mumble-ice
    restart: unless-stopped
    depends_on:
      - mumble
    network_mode: "service:mumble"
    pid: "service:mumble"
    environment:
      ICE_SECRET: ${MUMBLE_ICE_SECRET}
      BOT_PASSWORD: ${MUMBLE_PASSWORD}
      BOT_NAME: website
      CERT_SRC_CRT: /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.crt
      CERT_SRC_KEY: /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.key
    volumes:
      - mumble_data:/data
      - caddy_data:/caddy:ro

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - mediamtx
      - web
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - relay

networks:
  relay:
    driver: bridge
    ipam:
      config:
        # Festes Subnetz: mediamtx.yml (webrtcTrustedProxies) und HOOK_SUBNET in .env verlassen sich darauf.
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
  web_data:
  mumble_data:
